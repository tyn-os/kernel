[package]
name = "tyn-kernel"
version = "0.1.0"
edition = "2021"
authors = ["James James"]

[features]
# Isolation Stage-0 T2 harness (OFF by default; build --features guard_selftest).
# The first syscall on a guarded kernel stack writes that stack's guard page to
# prove the guard #PFs. Never compiled into production.
guard_selftest = []

[dependencies]
x86_64 = "0.14"
uart_16550 = "0.2"
spin = "0.9"
linked_list_allocator = "0.9"
log = "0.4"
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
virtio-drivers = { version = "0.13", default-features = false, features = ["alloc"] }

[patch.crates-io]
virtio-drivers = { path = "virtio-drivers-patched" }

[dependencies.smoltcp]
version = "0.13"
default-features = false
features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-dhcpv4",
    "proto-dhcpv4",
    "alloc",
]

[profile.release]
debug = true
lto = false
