[package]
name = "tyn-kernel"
version = "0.1.0"
edition = "2021"
authors = ["James James"]

[features]
# Isolation Stage-0 T2 harness (OFF by default; build --features guard_selftest).
# The first syscall on a guarded kernel stack writes that stack's guard page to
# prove the guard #PFs. Never compiled into production.
guard_selftest = []

# Isolation Stage-2 ring-3 transition shim (OFF by default; --features stage2_shim).
# A trivial ring-3 program proves the DPL=3 int-gate + RSP0 + swapgs + iretq
# round-trip (T1/T3 + timing + the swapgs mutation-teeth). Never in production.
stage2_shim = []
# Sub-mutation: makes the excursion push a malformed iretq CS → the return-frame
# mutation-teeth (#GP on iretq). Run separately (it halts). Implies stage2_shim.
stage2_mut_iret = ["stage2_shim"]

# Stage-3 P2 forecast: count serving syscalls (write/writev/read/epoll_wait/
# sendfile) + dump periodically to serial, to measure syscalls/MB on the hot
# serving path (converts the derived ~50-100/MB into a measured number). Off by
# default; never in production.
syscall_count = []

# Isolation Stage-3a confinement teeth (OFF by default; --features confine_probe).
# A deliberate ring-3 write to a US=0 kernel address proves the MMU DENIES it as a
# US-violation and the kernel CONTAINS it (item-4 longjmp, not halt); a mutation
# pass toggles the target US=1 to show the same write then succeeds. Never in
# production. See src/confine_probe.rs.
confine_probe = []

# Isolation Stage-3b.2 SMAP copy-site hunt instrument (OFF by default; --features
# smap_hunt). SMAP enforces only on real HW (TCG accepts CR4.SMAP but doesn't enforce),
# so the hunt runs on Nitro: the #PF handler logs each unwrapped kernel->US=1 access
# (dedup by ip), sets AC, and retries — one run enumerates the sites across the exercised
# workload. Never in production (production wants the guard to enforce, not auto-recover).
smap_hunt = []

# Isolation Stage-3b.2 confused-deputy TEETH (OFF by default; --features deputy_probe).
# After SMAP is on, calls real syscall handlers with a KERNEL-range pointer arg and
# asserts the uaccess bounds-check rejects both the write path (clock_gettime) and the
# read path (futex) with EFAULT, kernel memory untouched. `deputy_mutation` additionally
# disables the bounds-check (user_accessible→true) so the SAME calls demonstrably deref
# the kernel address (write clobbers a sentinel; read leaks a value) — the contrast proves
# the check is enforcement, not luck. Never in production.
deputy_probe = []
deputy_mutation = ["deputy_probe"]

[dependencies]
x86_64 = "0.14"
uart_16550 = "0.2"
spin = "0.9"
linked_list_allocator = "0.9"
log = "0.4"
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
virtio-drivers = { version = "0.13", default-features = false, features = ["alloc"] }

[patch.crates-io]
virtio-drivers = { path = "virtio-drivers-patched" }

[dependencies.smoltcp]
version = "0.13"
default-features = false
features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-dhcpv4",
    "proto-dhcpv4",
    "alloc",
]

[profile.release]
debug = true
lto = false
