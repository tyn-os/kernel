[package]
name = "tyn-kernel"
version = "0.1.0"
edition = "2021"
authors = ["James James"]

[features]
# Isolation Stage-0 T2 harness (OFF by default; build --features guard_selftest).
# The first syscall on a guarded kernel stack writes that stack's guard page to
# prove the guard #PFs. Never compiled into production.
guard_selftest = []

# Isolation Stage-2 ring-3 transition shim (OFF by default; --features stage2_shim).
# A trivial ring-3 program proves the DPL=3 int-gate + RSP0 + swapgs + iretq
# round-trip (T1/T3 + timing + the swapgs mutation-teeth). Never in production.
stage2_shim = []
# Sub-mutation: makes the excursion push a malformed iretq CS → the return-frame
# mutation-teeth (#GP on iretq). Run separately (it halts). Implies stage2_shim.
stage2_mut_iret = ["stage2_shim"]

# Stage-3 P2 forecast: count serving syscalls (write/writev/read/epoll_wait/
# sendfile) + dump periodically to serial, to measure syscalls/MB on the hot
# serving path (converts the derived ~50-100/MB into a measured number). Off by
# default; never in production.
syscall_count = []

[dependencies]
x86_64 = "0.14"
uart_16550 = "0.2"
spin = "0.9"
linked_list_allocator = "0.9"
log = "0.4"
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
virtio-drivers = { version = "0.13", default-features = false, features = ["alloc"] }

[patch.crates-io]
virtio-drivers = { path = "virtio-drivers-patched" }

[dependencies.smoltcp]
version = "0.13"
default-features = false
features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-dhcpv4",
    "proto-dhcpv4",
    "alloc",
]

[profile.release]
debug = true
lto = false
